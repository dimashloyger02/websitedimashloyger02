<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Test</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: orange; border: none; color: black; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Уведомления готовы</h1>
    <p>Нажми кнопку, чтобы протестировать пуш.</p>
    <button id="testBtn">Показать тестовое уведомление</button>

    <script>
        // 1. РЕГИСТРАЦИЯ SERVICE WORKER
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => {
                        console.log('SW зарегистрирован:', reg.scope);
                        reg.update(); // Для тестов обновляем каждый раз
                    })
                    .catch(err => console.error('Ошибка регистрации SW:', err));
            });
        }

        // 2. ТЕСТОВАЯ КНОПКА
        const btn = document.getElementById('testBtn');
        btn.addEventListener('click', async () => {
            if (!("Notification" in window)) {
                alert("Нет поддержки уведомлений");
                return;
            }
            const permission = await Notification.requestPermission();
            if (permission !== "granted") {
                alert("Разреши уведомления!");
                return;
            }

            const registration = await navigator.serviceWorker.getRegistration();
            if (registration) {
                await registration.showNotification('Тест работы', {
                    body: 'Уведомление сработало! Попробуй нажать кнопки.',
                    icon: 'https://media.brawltime.ninja/avatars/28000000.webp?size=192',
                    badge: 'https://media.brawltime.ninja/avatars/28000000.webp?size=192',
                    actions: [
                        { action: 'reply', title: 'Ответить' },
                        { action: 'alert', title: 'Показать сообщение' },
                        { action: 'view', title: 'Открыть сайт' }
                    ]
                });
            }
        });

        // 3. ОБРАБОТКА КЛИКОВ ПО ПУШАМ
        const params = new URLSearchParams(window.location.search);
        const action = params.get('action');
        const message = params.get('message');

        if (action === 'show-input') {
            const text = prompt(message || 'Введите текст:');
            if (text) console.log('Ответ:', text);
            window.history.replaceState({}, '', window.location.pathname);
        } 
        else if (action === 'show-alert') {
            alert(message || 'Это сработало из пуша!');
            window.history.replaceState({}, '', window.location.pathname);
        }
    </script>
</body>
</html>
