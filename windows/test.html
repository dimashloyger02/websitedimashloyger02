<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приветствие</title>
    <style>
    /* Убираем лишние отступы */
    body { 
        margin: 0; 
        padding: 0; 
        background-color: #ffffff; 
        font-family: sans-serif; 
        font-size: 14px; 
    }
    /* Синяя шапка сайта */
    .header { 
        background-color: #0055aa; 
        color: #ffffff; 
        padding: 5px; 
        font-weight: bold; 
    }
    /* Основной контент карточки */
    .card { 
        padding: 8px; 
    }
    /* Классическая WAP-полоска для полей ввода */
    .row { 
        background-color: #e5edf5; 
        padding: 6px; 
        margin-bottom: 4px; 
        border-left: 3px solid #0055aa;
    }
    input { 
        width: 95%; 
        border: 1px solid #999; 
        padding: 3px; 
        margin-top: 4px;
    }
    /* Стилизуем кнопку под классическую ссылку-кнопку */
    .btn { 
        display: block; 
        text-align: center;
        background-color: #0055aa; 
        color: #ffffff !important; 
        padding: 6px; 
        margin: 8px 0; 
        text-decoration: none; 
        font-weight: bold;
        cursor: pointer;
        border-radius: 3px;
    }
    .btn:active {
        background-color: #003377;
    }
    /* Блок вывода результата */
    #result_message { 
        color: #d00000; 
        font-weight: bold; 
        padding: 5px; 
    }
</style>
</head>
<body>
<div class="header">WAP.Приветствие</div>
<div class="card">
  <div class="row">
    Введите ваше имя:<br>
    <input id="user_name" type="text"/>
  </div>
  
  <div class="btn" onclick="testFunction()">[ Запустить ]</div>
  
  <p id="result_message"></p>
</div>
    
  <script>
    // Старый добрый синтаксис JavaScript, понятный любым телефонам
    var WMLBrowser = {
        getVar: function(id) {
            return document.getElementById(id).value;
        },
        setVar: function(id, value) {
            document.getElementById(id).innerHTML = value;
        },
        refresh: function() {}
    };

    function testFunction() {
        var name = WMLBrowser.getVar("user_name");
        
        if (name === "") {
            name = "Аноним";
        }
        
        var greeting = "Ура, скрипт работает! Привет, " + name;
        WMLBrowser.setVar("result_message", greeting);
    }
  </script>

</body>
</html>
